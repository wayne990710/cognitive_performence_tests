<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>主控端後臺</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: "微軟正黑體", sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .control-panel { background-color: #f1f2f6; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        button { font-size: 18px; padding: 10px 20px; margin-right: 10px; cursor: pointer; border: none; border-radius: 5px; }
        .btn-start { background-color: #2ecc71; color: white; }
        .btn-start:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .btn-end { background-color: #e67e22; color: white; }
        .btn-end:disabled { background-color: #95a5a6; cursor: not-allowed; }

        fieldset { border: 1px solid #dcdde1; border-radius: 8px; margin-bottom: 15px; background-color: white; }
        legend { font-weight: bold; color: #2c3e50; padding: 0 8px; }
        fieldset label { font-size: 17px; margin-right: 25px; cursor: pointer; display: inline-block; padding: 6px 0; }
        fieldset input[type="radio"] { transform: scale(1.3); margin-right: 6px; }
        .hint { font-size: 14px; color: #7f8c8d; margin: 6px 0 0 0; }

        #session-box {
            display: none;
            background-color: #e8f6f3; border-radius: 8px;
            padding: 15px 20px; margin-top: 15px; color: #16624f;
            font-size: 16px; line-height: 1.8;
        }
        #session-box code { background-color: #ffffff; padding: 2px 6px; border-radius: 4px; color: #2c3e50; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 18px; }
        th, td { border: 1px solid #dcdde1; padding: 12px; text-align: left; }
        th { background-color: #f5f6fa; }

        #dup-warning {
            display: none;
            background-color: #fdecea; border: 2px solid #e74c3c;
            color: #922b21; padding: 12px 16px; border-radius: 8px;
            margin-top: 15px; font-size: 16px; line-height: 1.6;
        }
        tr.dup-row td { background-color: #fdecea; }

        .status-waiting { color: #7f8c8d; }
        .status-stroop { color: #e67e22; font-weight: bold; }
        .status-stroop-done { color: #2980b9; font-weight: bold; }
        .status-twoback { color: #8e44ad; font-weight: bold; }
        .status-completed { color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>
    <h1>測驗主控端後臺</h1>

    <div class="control-panel">
        <fieldset>
            <legend>施測類型</legend>
            <label><input type="radio" name="practice_type" value="first"> 第一次施測（2-back 做 12 題練習）</label>
            <label><input type="radio" name="practice_type" value="regular" checked> 一般施測（2-back 做 6 題暖身）</label>
            <p class="hint">整個研究期間只有第一天的第一場選「第一次施測」，其餘都選「一般施測」。</p>
        </fieldset>

        <fieldset>
            <legend>當日場次</legend>
            <label><input type="radio" name="session_slot" value="1" checked> 當日第 1 次</label>
            <label><input type="radio" name="session_slot" value="2"> 當日第 2 次</label>
            <p class="hint">由主控端統一寫入所有人的資料，學生端不需要選。</p>
        </fieldset>

        <p style="font-size: 20px; font-weight: bold;">目前已連線學生人數：<span id="user-count">0</span> 人</p>

        <div id="dup-warning">
            <b>注意：有重複的班級座號</b><span id="dup-list"></span><br>
            兩位學生打錯成同一個號碼、或同一個人用兩支裝置登入時，
            他們的資料會混在同一個座號底下而分不出來。請先確認並請學生改正，再開始測驗。
        </div>
        <button class="btn-start" id="btn-start" onclick="startTest()">開始測驗</button>
        <button class="btn-end" id="btn-end" onclick="endSession()" disabled>結束本場</button>

        <div id="session-box">
            <div><b>本場代碼：</b><span id="s-id"></span>　<b>施測類型：</b><span id="s-type"></span>　<b>場次：</b>當日第 <span id="s-slot"></span> 次</div>
            <div><b>Stroop 資料：</b><code id="s-stroop"></code></div>
            <div><b>2-back 資料：</b><code id="s-twoback"></code></div>
            <div class="hint">資料每答完一題就即時寫入上述檔案，不需要按匯出；手機斷線或伺服器重開都不會影響已寫入的部分。</div>
        </div>
    </div>

    <h3>學生測驗進度監控：</h3>
    <table>
        <thead>
            <tr>
                <th>班級座號</th>
                <th>目前狀態</th>
            </tr>
        </thead>
        <tbody id="user-list">
        </tbody>
    </table>

    <script>
        const socket = io();

        socket.on('connect', () => {
            socket.emit('request_status');
        });

        socket.on('update_users', (data) => {
            const tbody = document.getElementById('user-list');
            tbody.innerHTML = "";

            data.users.forEach(user => {
                const tr = document.createElement('tr');
                if (user.duplicate) tr.className = 'dup-row';

                const tdId = document.createElement('td');
                tdId.innerText = user.student_id + (user.duplicate ? '（重複）' : '');

                const tdStatus = document.createElement('td');
                tdStatus.innerText = user.status;

                if (user.status === '等待中') {
                    tdStatus.className = 'status-waiting';
                } else if (user.status === 'Stroop 測驗中' || user.status === '測驗中') {
                    tdStatus.className = 'status-stroop';
                } else if (user.status === 'Stroop 已完成') {
                    tdStatus.className = 'status-stroop-done';
                } else if (user.status === '記憶測驗中') {
                    tdStatus.className = 'status-twoback';
                } else if (user.status === '已完成') {
                    tdStatus.className = 'status-completed';
                }

                tr.appendChild(tdId);
                tr.appendChild(tdStatus);
                tbody.appendChild(tr);
            });

            document.getElementById('user-count').innerText = data.users.length;

            const dups = data.duplicate_ids || [];
            document.getElementById('dup-warning').style.display = dups.length ? 'block' : 'none';
            document.getElementById('dup-list').innerText = dups.length ? '：' + dups.join('、') : '';
        });

        const SESSION_BOX_HTML = document.getElementById('session-box').innerHTML;

        socket.on('session_info', (data) => {
            const box = document.getElementById('session-box');
            box.innerHTML = SESSION_BOX_HTML;
            box.style.display = 'block';
            document.getElementById('s-id').innerText = data.session_id;
            document.getElementById('s-type').innerText =
                (data.practice_type === 'first') ? '第一次施測（12 題練習）' : '一般施測（6 題暖身）';
            document.getElementById('s-slot').innerText = data.session_slot;
            document.getElementById('s-stroop').innerText = data.stroop_csv;
            document.getElementById('s-twoback').innerText = data.twoback_csv;

            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-end').disabled = false;
            setOptionsEnabled(false);
        });

        socket.on('session_ended', (data) => {
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-end').disabled = true;
            setOptionsEnabled(true);

            // 把場次資訊框換成「已結束」，不要繼續顯示成像是還在進行中，
            // 否則下一場開始前會分不清畫面上的檔案路徑是哪一場的。
            const box = document.getElementById('session-box');
            box.innerHTML = '<b>上一場（' + (data && data.session_id ? data.session_id : '') +
                '）已結束。</b>資料已寫入檔案，可以開始下一場。';
        });

        function setOptionsEnabled(enabled) {
            document.querySelectorAll('fieldset input[type="radio"]').forEach(r => {
                r.disabled = !enabled;
            });
        }

        function selectedValue(name) {
            const el = document.querySelector(`input[name="${name}"]:checked`);
            return el ? el.value : null;
        }

        function startTest() {
            const count = parseInt(document.getElementById('user-count').innerText);

            if (count === 0) {
                alert("目前沒有學生連線，無法開始測驗。");
                return;
            }

            const practiceType = selectedValue('practice_type');
            const sessionSlot = selectedValue('session_slot');

            const typeText = (practiceType === 'first')
                ? '第一次施測（2-back 做 12 題練習）'
                : '一般施測（2-back 做 6 題暖身）';

            const msg = "確定要開始測驗嗎？這將同步所有學生的畫面。\n\n"
                      + "施測類型：" + typeText + "\n"
                      + "當日場次：第 " + sessionSlot + " 次\n"
                      + "連線人數：" + count + " 人";

            if (confirm(msg)) {
                socket.emit('start_test', {
                    practice_type: practiceType,
                    session_slot: sessionSlot
                });
            }
        }

        function endSession() {
            if (confirm("確定要結束本場嗎？結束後才能開始下一場。\n資料已經即時寫入檔案，不會遺失。")) {
                socket.emit('end_session');
            }
        }
    </script>
</body>
</html>
